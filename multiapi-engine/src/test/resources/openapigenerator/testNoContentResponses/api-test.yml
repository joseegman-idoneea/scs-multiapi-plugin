---
openapi: "3.0.0"
info:
  version: 1.0.0
  title: No Content Responses Test
  license:
    name: MIT
servers:
  - url: http://localhost:8080/v1
paths:
  /items:
    get:
      summary: List items
      operationId: listItems
      tags:
      - items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{itemId}:
    delete:
      summary: Delete item
      operationId: deleteItem
      tags:
      - items
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
  responses:
    NoContent:
      description: No content
    Unauthorized:
      description: Unauthorized access
    NotFound:
      description: Resource not found

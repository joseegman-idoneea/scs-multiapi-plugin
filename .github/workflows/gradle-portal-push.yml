name: Java CI with Gradle (Push)

on:
  push:
    branches: [main]

jobs:
  check-pr-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      labels: ${{ steps.get-pr.outputs.pr_labels }}
    steps:
      - name: Get Pull Request information
        uses: 8BitJonny/gh-get-current-pr@4.0.0
        id: get-pr

  check-version:
    runs-on: ubuntu-latest
    needs: [check-pr-labels]
    if: ${{ contains(needs.check-pr-labels.outputs.labels, 'release') || contains(needs.check-pr-labels.outputs.labels, 'gradle') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if engine version is updated
        uses: avides/actions-project-version-check@v2
        id: engine-version-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: multiapi-engine/pom.xml
        continue-on-error: true
      - name: Gradle version
        id: get-version
        run: |
          cd scs-multiapi-gradle-plugin
          echo "version=$(gradle properties -q | grep "version:" | awk '{print $2}')" | tee $GITHUB_OUTPUT
      - name: Check if plugin version has been published
        id: plugin-version-check
        run: |
          url="https://plugins.gradle.org/plugin/com.sngular.scs-multiapi-gradle-plugin/${{ steps.get-version.outputs.version }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "HTTP status for version ${{ steps.get-version.outputs.version }}: $status"
          # 400 => version not yet published (OK to release); anything else => already published
          test "$status" = "400"

  build:
    runs-on: ubuntu-latest
    needs: [check-version, check-pr-labels]
    if: contains(needs.check-version.result, 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build Engine Plugin
        run: |
          cd multiapi-engine
          mvn -B install

      - name: Publish Gradle plugin to Gradle Repo
        run: |
          cd scs-multiapi-gradle-plugin
          gradle wrapper
          chmod +x gradlew
          ./gradlew build
          ./gradlew publishPlugins -Dgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} -Dgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Gradle version
        id: get-version
        run: |
          version=$(grep -E "^version[[:space:]]*=" scs-multiapi-gradle-plugin/build.gradle | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - name: Create a Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get-version.outputs.version }}
          prerelease: false
          name: "Gradle Release ${{ steps.get-version.outputs.version }}"

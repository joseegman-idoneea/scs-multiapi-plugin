name: Java CI with Gradle (PR)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

concurrency: pr-gradle-${{ github.event.pull_request.id }}

permissions:
  contents: read
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'gradle') }}
    steps:
      - uses: actions/checkout@v4
      - name: Gradle version
        id: get-version
        run: |
          cd scs-multiapi-gradle-plugin
          # Usar el wrapper para asegurar la versión de Gradle configurada en gradle-wrapper.properties
          # Ejecutar con flags para salida determinista
          version=$(./gradlew --no-daemon --console=plain properties -q | grep "version:" | awk '{print $2}')
          echo "version=$version" | tee $GITHUB_OUTPUT
      - name: Check if plugin version has been published
        id: plugin-version-check
        continue-on-error: true
        run: |
          url="https://plugins.gradle.org/plugin/com.sngular.scs-multiapi-gradle-plugin/${{ steps.get-version.outputs.version }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "HTTP status for version ${{ steps.get-version.outputs.version }}: $status"
          # 400 => version not yet published (OK); anything else => already published
          test "$status" = "400"
      - name: Warn about version specification
        if: steps.plugin-version-check.outcome != 'success'
        uses: thollander/actions-comment-pull-request@v3
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: Project version has not been updated in build.gradle. Please, update your version using https://semver.org specifications
      - name: Fail
        if: steps.plugin-version-check.outcome != 'success'
        uses: cutenode/action-always-fail@v1
